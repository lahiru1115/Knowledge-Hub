name: web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/web
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API client is up to date with contracts/openapi.yaml
        run: npm run api:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Initial JavaScript budget (250 KB gzipped, NFR-PERF-09)
        run: node scripts/check-bundle-size.mjs
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
