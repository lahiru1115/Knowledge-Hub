# Secret scanning (.github/workflows/security.yml). The default rules stay on; this only allows the local
# development passwords that infra/db/init.sql, compose.yaml, the CI workflows and the tests use on purpose.
# They are placeholders for a throwaway database on localhost or in a CI container, never for a real one
# (infra/deploy/make-init.sh generates real ones). Allowed by value, not by path, so a real secret added to the
# same files is still reported.
title = "Knowledge Hub"

[extend]
useDefault = true

[[allowlists]]
description = "Local development database role passwords from infra/db/init.sql"
regexTarget = "match"
regexes = [
  '''(core_migrator|core_app|ai_migrator|ai_app)_dev''',
]

[[allowlists]]
description = "The default PostgreSQL superuser password of the throwaway local and CI database"
regexTarget = "match"
regexes = [
  '''(?i)password["']?\s*[:=]\s*["']?(\$\{[A-Za-z_]+:-)?postgres(["'}\s]|$)''',
]
