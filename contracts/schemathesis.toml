# Schemathesis settings for contract tests (Doc 02 §8.1).
# Run in CI against the composed stack with a seeded test user (NFR-MAIN-02):
#   st --config-file contracts/schemathesis.toml run contracts/openapi.yaml \
#     --exclude-path-regex '^/health/|^/(auth/(logout|login|register|refresh)|me$)' \
#     -H "Cookie: kh_at=...; kh_csrf=..." -H "X-CSRF-Token: ..."
# The session cookie is passed as headers, so the test user must be registered first (see contracts/README.md).
[[project]]
title = "Knowledge Hub Core API"
base-url = "http://localhost:8080/api/v1"
workers = 1

[generation]
mode = "all"
max-examples = 20
# The session is sent as headers, so the cookie security parameter must not be generated or broken.
with-security-parameters = false
# PostgreSQL text cannot hold NUL; the API refuses it (NullCharacterTests), so generating it only adds noise.
allow-x00 = false

# Every endpoint may answer 503 when a dependency is down (the AI service is off in this stack): that is a documented
# answer, not a server fault. 500 is still a failure.
[checks.not_a_server_error]
expected-statuses = ["2XX", "3XX", "4XX", "503"]

# Whether a string is a single emoji cannot be written as a schema, so random icons are rightly refused.
[[operations]]
include-name = "POST /collections"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "PATCH /collections/{id}"
checks.positive_data_acceptance.enabled = false

# Whether these inputs are accepted depends on something a schema cannot say, so random schema-valid values are
# rightly refused with a 400: a time zone name, a reset token, the common-password list, "every AI tag is also a tag",
# and a target that must differ from the source. Their rejection paths have their own integration tests.
[[operations]]
include-name = "GET /dashboard"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "POST /auth/password-reset/confirm"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "PUT /me/password"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "POST /resources"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "DELETE /collections/{id}"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "POST /tags/{id}/merge"
checks.positive_data_acceptance.enabled = false

# Valid-looking links can still have a host that is not a real name, and an empty string is a "date-time" to the
# generator. Bulk actions need a non-empty list of tags together with the other fields. These are refused with a 400.
[[operations]]
include-name = "POST /ai/tag-suggestions"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "POST /metadata/preview"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "PATCH /resources/{id}"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "POST /resources/bulk"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "GET /search/semantic"
checks.positive_data_acceptance.enabled = false

[[operations]]
include-name = "GET /resources"
checks.positive_data_acceptance.enabled = false   # offsets such as +23:45 are valid RFC 3339 text but not a real zone
[[operations]]
include-name = "POST /chat/sessions"
checks.positive_data_acceptance.enabled = false   # random text may contain a NUL character, which is refused
[[operations]]
include-name = "PATCH /chat/sessions/{id}"
checks.positive_data_acceptance.enabled = false
[[operations]]
include-name = "POST /chat/sessions/{id}/messages"
checks.positive_data_acceptance.enabled = false
# A link longer than the web server's request-line limit is answered by the server itself (414, no body).
[[operations]]
include-name = "GET /resources/check-url"
checks.negative_data_rejection.enabled = false
checks.content_type_conformance.enabled = false
checks.response_schema_conformance.enabled = false
checks.positive_data_acceptance.enabled = false

# "Restore" answers 404 for a resource that is not in the trash, so a restore straight after a create is a rightful 404.
[checks.ensure_resource_availability]
enabled = false
