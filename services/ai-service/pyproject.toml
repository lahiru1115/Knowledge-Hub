[project]
name = "knowledge-hub-ai"
version = "0.1.0"
description = "Knowledge Hub AI service: indexing, retrieval, summaries, tag suggestions and chat"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "pydantic-settings>=2.6",
  "yake>=0.7.3",
  "fastembed>=0.9.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL database with the ai schema (AI_TEST_MIGRATOR_URL, AI_TEST_APP_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["yake", "fastembed"]
ignore_missing_imports = true
