# Local stack (Doc 02 §10.1). Infrastructure services only for now: core-api, ai-service,
# the migrate-* one-shots and web are added to this file as each Dockerfile lands.
name: knowledge-hub
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: knowledge_hub
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d knowledge_hub"]
      interval: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  jaeger:
    image: jaegertracing/jaeger:latest
    ports: ["16686:16686", "4317:4317"]
volumes:
  pgdata:
  ollama:
